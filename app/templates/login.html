{% extends 'base.html' %}
{% block title %}Log in · LNMIIT Spaces{% endblock %}
{% block content %}
<section class="card login-card">
  <h1>Log in</h1>
  <p class="muted">Sign in to book a space and manage your reservations.</p>
  <form action="/login" method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" value="{{ values.get('email', '') }}" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>
  <p><a href="/rooms">Browse rooms without logging in</a></p>
</section>
{% endblock %}
